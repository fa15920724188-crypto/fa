services:
  - type: web
    name: carpet-ai-sales-kb
    env: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: SESSION_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: USERS_JSON
        sync: false
